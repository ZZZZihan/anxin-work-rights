<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安薪乐业 · 劳动权益保障平台</title>

  <!-- 样式：变量 → 基础 → 组件 → 页面 -->
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/chat.css">
  <link rel="stylesheet" href="styles/evidence.css">
  <link rel="stylesheet" href="styles/track.css">
  <link rel="stylesheet" href="styles/doc.css">
</head>
<body>

<div id="app">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span>9:41</span>
    <span style="font-size:16px;font-weight:700;letter-spacing:-1px;">安薪乐业</span>
    <span>📶 🔋</span>
  </div>

  <!-- 页面动态渲染区 -->
  <div id="page-container"></div>

  <!-- 底部 TabBar -->
  <div class="tabbar">
    <div class="tab-item" data-page="home">
      <div class="tab-icon">🏠</div><span>首页</span>
    </div>
    <div class="tab-item" data-page="chat">
      <div class="tab-icon">🤖</div><span>AI咨询</span>
    </div>
    <div class="tab-item" data-page="evidence">
      <div class="tab-icon">📁</div><span>证据</span>
    </div>
    <div class="tab-item" data-page="track">
      <div class="tab-icon">📊</div><span>追踪</span>
    </div>
    <div class="tab-item" data-page="doc">
      <div class="tab-icon">📄</div><span>文书</span>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>
</div>

<!-- 入口脚本（ES Module） -->
<script type="module" src="js/main.js"></script>

</body>
</html>
